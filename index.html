<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रितिक और जयदेव का कोडिंग हब</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        header { background: #333; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: left; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
        .card h3 { margin: 10px 0 5px 0; color: #333; }
        .card p { color: #666; font-size: 14px; }
        .btn { display: inline-block; background: #007bff; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; margin-top: 10px; font-weight: bold; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <header>
        <h1>🚀 हमारा फिजिक्स और कोडिंग हब</h1>
        <p>क्लास 11th के सभी महत्वपूर्ण प्रोग्राम्स यहाँ स्टोर और रन करें</p>
    </header>

    <!-- यहाँ आपके सारे प्रोग्राम्स कार्ड्स के रूप में दिखेंगे -->
    <div class="grid">

        <!-- प्रोग्राम 1: प्रक्षेप्य गति -->
        <div class="card">
            <img src="https://unsplash.com" alt="Projectile Motion">
            <h3>1. प्रक्षेप्य गति (Projectile Motion)</h3>
            <p>इस प्रोग्राम की मदद से आप एंगल और वेलोसिटी डालकर प्रक्षेप्य गति को लाइव कैलकुलेट और रन कर सकते हैं।</p>
            <a href="https://replit.com" target="_blank" class="btn">🚀 प्रोग्राम रन करें</a>
        </div>

    </div>

</body>
</html>
